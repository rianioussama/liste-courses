<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon"
      sizes="512x512"
      href="icon-512.png">

<link rel="apple-touch-icon"
      sizes="192x192"
      href="icon-192.png">

<meta name="theme-color" content="#4f46e5">
<meta name="app-version" content="1.0.0">

<title>Liste de Courses</title>

<style>

:root{
 --bg:#f4f6fb;
 --card:#ffffff;
 --text:#111827;
 --primary:#4f46e5;
}

body.dark{
 --bg:#111827;
 --card:#1f2937;
 --text:#f9fafb;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Segoe UI,sans-serif;
 background:var(--bg);
 color:var(--text);
}

header{
  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #6366f1
    );

  padding:20px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-top{
  margin-bottom:16px;
}

.header-top h1{
  color:white;
  margin:0;
  font-size:1.7rem;
  font-weight:700;
}

.search-container{
  margin-bottom:16px;
}

#search{
  width:100%;
  max-width:none;
  border:none;
  padding:14px 18px;
  border-radius:16px;
  font-size:1rem;

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.08);
}

.header-nav{
  display:flex;
  gap:10px;
}

button,
input{
 padding:10px;
 border-radius:10px;
 border:1px solid #ccc;
}

button{
  cursor:pointer;
  border:none;
  transition:.2s;
}

.header-nav button{
  flex:1;

  padding:14px;

  border-radius:14px;

  background:white;

  font-weight:600;
}

.main{
 max-width:1200px;
 margin:auto;
 padding:16px;
}

.card{
  background:var(--card);

  border-radius:20px;

  padding:18px;

  margin-bottom:16px;

  box-shadow:
    0 4px 20px rgba(0,0,0,.04);
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.grow{
 flex:1;
}

.item{
 display:flex;
 gap:8px;
 align-items:center;
 padding:8px 0;
}

.done{
 text-decoration:line-through;
 opacity:.5;
}

.item-hiding{
  opacity:0;
  transform:translateX(20px);
  max-height:0;
  margin:0;
  padding:0;
  overflow:hidden;
  transition:
    opacity .4s ease,
    transform .4s ease,
    max-height .4s ease,
    padding .4s ease;
}

.active{
  background:#22c55e !important;
  color:white;
  box-shadow:
    0 4px 12px
    rgba(34,197,94,.3);
}

.meta{
 font-size:.8rem;
 opacity:.75;
}

.progress{
 height:12px;
 background:#ddd;
 border-radius:12px;
 overflow:hidden;
}

.progress div{
 background:#22c55e;
 height:100%;
}

.favorite-btn{
 min-width:40px;
}

.qty-btn{
 min-width:32px;
}

.dropdown{
  display:none;

  position:fixed;

  top:140px;
  right:20px;

  background:var(--card);

  border-radius:16px;

  box-shadow:
    0 12px 30px rgba(0,0,0,.15);

  padding:8px;

  min-width:240px;

  z-index:9999;
}

.dropdown button{
  display:block;
  width:100%;
  margin-bottom:6px;
  text-align:left;
}

.dropdown button:last-child{
  margin-bottom:0;
}

.dropdown.show{
  display:block;
}



.product-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.product-main{
  flex:1;
  min-width:0;
}

.product-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

@media (max-width:768px){

  .product-name{
    font-size:1rem;
  }

  .product-actions{
    gap:4px;
  }

  .qty-btn,
  .favorite-btn{
    width:40px;
    height:40px;
    min-width:40px;
  }

}

.product-name{
 font-size:1.15rem;
 font-weight:600;
}

.product-meta{
 font-size:.85rem;
 opacity:.7;
 margin-top:4px;
}

.badge{
 display:inline-block;
 padding:3px 8px;
 border-radius:999px;
 font-size:.75rem;
 font-weight:600;
 margin-left:8px;
}

.badge-warning{
 background:#fef3c7;
 color:#92400e;
}

.qty-btn{
  width:36px;
  height:36px;

  border-radius:10px;

  background:#f3f4f6;
}

.product-actions strong{
  min-width:24px;
  text-align:center;
}

.favorite-active{
 color:#facc15;
}

.category-header{
  transition:0.2s;
}

.category-header:active{
  background:rgba(79,70,229,.08);
}

@media (hover:hover){

  .category-card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
  }

}

.category-icon{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 width:38px;
 height:38px;
 border-radius:50%;
 background:#eef2ff;
 margin-right:10px;
 font-size:20px;
}

.category-count{
 background:#e0e7ff;
 color:#4338ca;
 border-radius:999px;
 padding:4px 10px;
 font-size:.8rem;
 font-weight:700;
 margin-left:10px;
}

.category-card{
  overflow:hidden;
}

#toolsBtn{
  flex:0;
  min-width:60px;
}

.badge-count{
  margin-left:6px;

  background:white;

  color:#22c55e;

  padding:2px 8px;

  border-radius:999px;

  font-size:.75rem;

  font-weight:bold;
}

#favoritesBtn.active{
  background:#facc15;
  color:#111827;
}

.category-arrow{
  font-size:18px;
  width:24px;
  text-align:center;
  flex-shrink:0;
}

.category-arrow.open{
  transform:rotate(90deg);
}

</style>
      
</head>

<body>

<header>
  <div class="header-top">
    <h1>🛒 Liste de Courses</h1>
  </div>

  <div class="search-container">
    <input
      id="search"
      placeholder="🔍 Rechercher un produit..."
    >
  </div>

  <div class="header-nav">

    <button id="catalogBtn">
      📝 Liste
    </button>

    <button id="storeBtn">
      🛒 Magasin
    </button>
	
    <button id="toolsBtn">
      ⚙️
    </button>

  </div>

  <div id="toolsDropdown" class="dropdown">

    <button id="collapseAllBtn">
      ➖ Tout plier
    </button>

    <button id="expandAllBtn">
      ➕ Tout déplier
    </button>

    <button id="darkBtn">
      🌙 Mode sombre
    </button>

  </div>

</header>

<div class="main">

<div
 id="progressCard"
 class="card"
 style="display:none">

 <div id="stats"></div>

 <div class="progress">
  <div id="bar"></div>
 </div>

</div>

<div
 id="actions"
 class="card">
</div>

<div id="app"></div>

</div>

<script>

const APP_NOTIFICATION = {
  version: '1.0.4',
  title: '🆕 Nouvelle version',
  message: 'Ajout de nouvelles fonctionnalités'
};

const defaults={

 mode:'catalog',
 
 showPurchased:false,

 dark:false,

 showFavorites:false,

 categories:[],

 products:[]

};

let db;

try{

 db=
  JSON.parse(
   localStorage.getItem(
    'shopping-v62'
   )
  );

}catch(e){

 db=null;

}

if(!db){

 db=defaults;

}

const isMobile =
 window.matchMedia(
  '(pointer:coarse)'
 ).matches;

if(db.showFavorites===undefined){

 db.showFavorites=false;

}

if(db.showPurchased === undefined){
db.showPurchased = false;
}

db.categories =
 Array.isArray(db.categories)
 ? db.categories
 : [];

db.products =
 Array.isArray(db.products)
 ? db.products
 : [];

db.categories.forEach(category=>{

 if(category.order===undefined){

  category.order=0;

 }

 if(category.collapsed===undefined){

  category.collapsed=true;

 }

});

db.products.forEach(product=>{

 if(product.favorite===undefined){

  product.favorite=false;

 }

 if(product.inList===undefined){

  product.inList=false;

 }

 if(product.listQuantity===undefined){

  product.listQuantity=1;

 }

 if(product.purchased===undefined){

  product.purchased=false;

 }

 if(product.frequency===undefined){

  product.frequency=0;

 }

 if(product.lastPurchase===undefined){

  product.lastPurchase=null;

 }

 if(
  !Array.isArray(
   product.purchaseHistory
  )
 ){

  product.purchaseHistory=[];

 }

});

function save(){

 localStorage.setItem(
  'shopping-v62',
  JSON.stringify(db)
 );

}

function uid(){

 return Date.now() + Math.random();

}

function getProductById(id){

 return db.products.find(
  p=>p.id===id
 );

}

function getCategoryById(id){

 return db.categories.find(
  c=>c.id===id
 );

}

function setMode(mode){

 db.mode=mode;

 save();

 render();

}

function daysAgo(date){

 if(!date){

  return 'Jamais acheté';

 }

 const diff=Math.floor(

  (
   Date.now()
   -
   new Date(date).getTime()
  )

  /
  86400000

 );

 if(diff===0){

  return 'Acheté aujourd’hui';

 }

 if(diff===1){

  return 'Acheté hier';

 }

 return 'Acheté il y a '
        +
        diff
        +
        ' jours';

}

function sortCategories(){

 db.categories.sort(
  (a,b)=>
   (a.order||0)
   -
   (b.order||0)
 );

}

function toggleFavorite(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.favorite=
  !product.favorite;

 save();

 render();

}

function toggleList(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.inList=
  !product.inList;

 if(!product.inList){

  product.listQuantity=1;

  product.purchased=false;

 }

 save();

 render();

}

function increaseQuantity(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.listQuantity=
  (product.listQuantity||1)+1;

 save();

 render();

}

function decreaseQuantity(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 if(
  product.listQuantity>1
 ){

  product.listQuantity--;

 }

 save();

 render();

}

function getListQuantity(product){

 return product.listQuantity || 1;

}


function togglePurchased(id){

 const product = getProductById(id);

 if(!product){
  return;
 }

 if(!product.purchased){

  const now = new Date().toISOString();

  product.frequency++;
  product.lastPurchase = now;

  product.purchaseHistory.push({
   date: now,
   quantity: product.listQuantity
  });

  product.purchased = true;

  save();

  const row =
   document.querySelector(
    '[data-product-id="'+id+'"]'
   );

  if(row){

   row.classList.add('item-hiding');

   setTimeout(()=>{
    render();
   },400);

  }else{
   render();
  }

 }else{

  product.purchased = false;

  save();
  render();

 }

}

function averageRepurchaseDays(product){

 if(
  product.purchaseHistory.length<2
 ){
  return null;
 }

 let total=0;

 for(
  let i=1;
  i<product.purchaseHistory.length;
  i++
 ){

  const previous=
   new Date(
    product.purchaseHistory[
      i-1
    ].date
   );

  const current=
   new Date(
    product.purchaseHistory[
      i
    ].date
   );

  total +=

   (
    current-previous
   )

   /86400000;

 }

 return Math.round(

  total/

  (
   product.purchaseHistory.length-1
  )

 );

}

function daysSinceLastPurchase(
 product
){

 if(
  !product.lastPurchase
 ){
  return null;
 }

 return Math.floor(

  (
   Date.now()
   -
   new Date(
    product.lastPurchase
   )
  )

  /86400000

 );

}

function shouldSuggest(
 product
){

 const average=
  averageRepurchaseDays(
   product
  );

 if(
  average===null
 ){
  return false;
 }

 const elapsed=
  daysSinceLastPurchase(
   product
  );

 if(
  elapsed===null
 ){
  return false;
 }

 return elapsed>=average;

}

function importTxtCatalog(text){

 let currentCategory = null;

 const lines = text
  .split('\n')
  .map(line => line.trim())
  .filter(Boolean);

 lines.forEach(line => {

  if(line.endsWith(':')){

   const categoryName =
    line.slice(0,-1).trim();

   let category =
    db.categories.find(
     c =>
      c.name.toLowerCase() ===
      categoryName.toLowerCase()
    );

   if(!category){

    category = {
      id: uid(),
      name: categoryName,
      order: db.categories.length + 1,
      collapsed: false
    };

    db.categories.push(category);
   }

   currentCategory = category;
   return;
  }

  if(!currentCategory){
   return;
  }

  const exists =
   db.products.some(
    p =>
     p.categoryId === currentCategory.id &&
     p.name.toLowerCase() ===
     line.toLowerCase()
   );

  if(exists){
   return;
  }

  db.products.push({
    id: uid(),
    name: line,
    categoryId: currentCategory.id,
    favorite: false,
    inList: false,
    listQuantity: 1,
    purchased: false,
    frequency: 0,
    lastPurchase: null,
    purchaseHistory: []
  });

 });

 save();
}

function toggleCategory(id){

 const category=
  getCategoryById(id);

 if(!category){
  return;
 }

 category.collapsed=
  !category.collapsed;

 save();

 render();

}

function toggleFavorites(){

 db.showFavorites=
  !db.showFavorites;

 save();

 render();

}

function addToList(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.inList=true;

 if(!product.listQuantity){

  product.listQuantity=1;

 }

 save();

 render();

}

 const n = name.toLowerCase();

 // Fruits et légumes
 if(
  n.includes('fruit') ||
  n.includes('légume') ||
  n.includes('legume')
 ){
  return '🥬';
 }

 // Viandes
 if(
  n.includes('viande') ||
  n.includes('boucherie') ||
  n.includes('boeuf') ||
  n.includes('porc') ||
  n.includes('poulet')
 ){
  return '🥩';
 }

 // Poissons
 if(
  n.includes('poisson') ||
  n.includes('saumon') ||
  n.includes('thon') ||
  n.includes('cabillaud')
 ){
  return '🐟';
 }

 // Produits laitiers
 if(
  n.includes('lait') ||
  n.includes('fromage') ||
  n.includes('yaourt') ||
  n.includes('beurre')
 ){
  return '🥛';
 }

 // Boulangerie
 if(
  n.includes('pain') ||
  n.includes('boulangerie') ||
  n.includes('baguette')
 ){
  return '🥖';
 }

// Petit-déjeuner
if(
 n.includes('petit déjeuner') ||
 n.includes('petit-déjeuner') ||
 n.includes('petit déjeuner') ||
 n.includes('muesli') ||
 n.includes('céréale') ||
 n.includes('cereale')
){
 return '🥣';
}

 // Café / Thé
 if(
  n.includes('café') ||
  n.includes('cafe') ||
  n.includes('thé') ||
  n.includes('the')
 ){
  return '☕';
 }

 // Boissons
 if(
  n.includes('boisson') ||
  n.includes('eau') ||
  n.includes('jus') ||
  n.includes('soda')
 ){
  return '🥤';
 }

 // Épicerie salée
 if(
  n.includes('épicerie salée') ||
  n.includes('epicerie salee') ||
  n.includes('riz') ||
  n.includes('pâtes') ||
  n.includes('pates') ||
  n.includes('semoule')
 ){
  return '🍝';
 }

 // Épicerie sucrée
 if(
  n.includes('épicerie sucrée') ||
  n.includes('epicerie sucree') ||
  n.includes('sucre') ||
  n.includes('farine')
 ){
  return '🧁';
 }

 // Chocolat
 if(
  n.includes('chocolat') ||
  n.includes('pépite') ||
  n.includes('pepite') ||
  n.includes('cacao')
 ){
  return '🍫';
 }

 // Goûter
 if(
  n.includes('goûter') ||
  n.includes('gouter') ||
  n.includes('biscuit') ||
  n.includes('cookie')
 ){
  return '🍪';
 }

 // Bonbons
 if(
  n.includes('bonbon') ||
  n.includes('confiserie')
 ){
  return '🍬';
 }

 // Apéro
 if(
  n.includes('apéro') ||
  n.includes('apero') ||
  n.includes('snack')
 ){
  return '🍿';
 }

 // Épices
 if(
  n.includes('épice') ||
  n.includes('epice') ||
  n.includes('sel') ||
  n.includes('poivre')
 ){
  return '🧂';
 }

 // Huiles
 if(
  n.includes('huile') ||
  n.includes('olive')
 ){
  return '🍶';
 }

 // Vinaigres
 if(
  n.includes('vinaigre')
 ){
  return '🍶';
 }

 // Sauces
 if(
  n.includes('sauce') ||
  n.includes('ketchup') ||
  n.includes('mayonnaise') ||
  n.includes('mayo')
 ){
  return '🥫';
 }

 // Surgelés
 if(
  n.includes('surgelé') ||

 ){

 if(

 if(

async function loadCatalog(){

 try{

  const response =
   await fetch('catalogue.txt');

  const text =
   await response.text();

  importTxtCatalog(text);

 }catch(error){

  console.error(
   'Impossible de charger catalogue.txt',
   error
  );

 }

}

function closeToolsMenu(){
  document
    .getElementById('toolsDropdown')
    .classList.remove('show');
}

function collapseAll(){
  db.categories.forEach(
    c => c.collapsed = true
  );

  save();
  closeToolsMenu();
  render();
}

function expandAll(){
  db.categories.forEach(
    c => c.collapsed = false
  );

  save();
  closeToolsMenu();
  render();
}

function toggleDark(){
  db.dark = !db.dark;

  save();
  closeToolsMenu();
  render();
}

function showAppNotification(){

  const seenVersion =
    localStorage.getItem(
      'notification-version'
    );

  if(
    seenVersion === APP_NOTIFICATION.version
  ){
    return;
  }

setTimeout(() => {
  alert(
    APP_NOTIFICATION.title +
    '\n\n' +
    APP_NOTIFICATION.message
  );
}, 500);


  localStorage.setItem(
    'notification-version',
    APP_NOTIFICATION.version
  );

}

function togglePurchasedVisibility(){

 db.showPurchased =
  !db.showPurchased;

 save();
 render();

}

function render(){

document.body.className=
db.dark
? 'dark'
: '';

const cartCount =
 db.products.filter(
  p => p.inList
 ).length;

storeBtn.innerHTML =
 '🛒 Magasin ' +
 (
   cartCount > 0
   ? '<span class="badge-count">'+cartCount+'</span>'
   : ''
 );

catalogBtn.className=
db.mode==='catalog'
? 'active'
: '';
storeBtn.className=
db.mode==='store'
? 'active'
: '';

if(db.mode === 'catalog'){

 actions.style.display='block';

 actions.innerHTML=
 `
 <div class="row">
   <button
     id="favoritesBtn"
     class="${db.showFavorites ? 'active' : ''}"
     onclick="toggleFavorites()"
   >
     ⭐ Favoris
   </button>
 </div>
 `;

}else{

 actions.style.display='block';

 const hiddenPurchased =
  db.products.filter(
   p => p.inList && p.purchased
  ).length;

 actions.innerHTML=
 `
 <div class="row">
   <button onclick="togglePurchasedVisibility()">
     ${
      db.showPurchased
      ? '🙈 Masquer les articles récupérés'
      : `✅ Afficher les articles récupérés (${hiddenPurchased})`
     }
   </button>
 </div>
 `;

}

const q =
 (search.value || '').toLowerCase();

app.innerHTML='';
if(db.mode==='store'){
progressCard.style.display=
'block';
const total=
db.products.filter(
p=>p.inList
).length;
const done=
db.products.filter(
p=>
p.inList
&&
p.purchased
).length;
stats.textContent=
done+
' / '+
total+
' articles récupérés';
bar.style.width=
(
total
?
done*100/total
:
0
)+'%';


}else{
progressCard.style.display=
'none';
}
sortCategories();
for(const cat of db.categories){
let items=

 db.products.filter(p=>{

  if(
   p.categoryId!==cat.id
  ){
   return false;
  }

  if(
   !p.name
     .toLowerCase()
     .includes(q)
  ){
   return false;
  }

  if(
   db.showFavorites
   &&
   !p.favorite
  ){
   return false;
  }

  return true;

 });

if(db.mode==='store'){

 items=
 items.filter(
  p =>
   p.inList &&
   (
    db.showPurchased ||
    !p.purchased
   )
 );

}

if(items.length===0){
 continue;
}
let html =
  '<div class="card category-card" data-id="'+cat.id+'">' +
  '<div class="row category-header" onclick="toggleCategory('+cat.id+')">' +
  '<span class="category-arrow ' +
  (cat.collapsed ? '' : 'open') +
  '">❯</span>' +
  '<h3 class="grow">' +
  categoryIcon(cat.name)+' '+cat.name+
  '<span class="category-count">' +
  items.length +
  '</span></h3>';

html+='</div>';
if(!cat.collapsed){
for(const p of items){

const badgeSuggest =
shouldSuggest(p)
? '<span class="badge badge-warning">🔔 À racheter</span>'
: '';


if(db.mode==='catalog'){

html +=
'<div class="product-row">'+

'<button class="favorite-btn '+(p.favorite ? 'favorite-active' : '')+'" onclick="toggleFavorite('+p.id+')">'+
(p.favorite ? '⭐' : '☆')+
'</button>'+

'<div class="product-main">'+

'<div class="product-name">'+
p.name+
badgeSuggest+
'</div>'+

'<div class="product-meta">'+
(
p.lastPurchase
? 'Dernier achat : '+daysAgo(p.lastPurchase)
: 'Jamais acheté'
)+
'</div>'+

'</div>'+

'<div class="product-actions">'+

(
p.inList
? '<button onclick="toggleList('+p.id+')">✅</button>'
: '<button onclick="addToList('+p.id+')">🛒</button>'
)+

(
p.inList
? '<button class="qty-btn" onclick="decreaseQuantity('+p.id+')">−</button>'+
'<strong>'+getListQuantity(p)+'</strong>'+
'<button class="qty-btn" onclick="increaseQuantity('+p.id+')">+</button>'
: ''
)+

'</div>'+
'</div>';

}
if(db.mode==='store'){

 html+=
 '<div class="item" data-product-id="'+p.id+'">'+

  '<input type="checkbox" '+

  (
   p.purchased
   ? 'checked'
   : ''
  )+

  ' onchange="togglePurchased('+p.id+')">' +

  '<span class="'+

  (
   p.purchased
   ? 'done'
   : ''
  )+

  '">' +

  p.name+

  ' x'+

  getListQuantity(p)+

  '</span>'+

  '</div>';

}

}

}

html+='</div>';

app.innerHTML+=html;

}

}
search.addEventListener(
 'input',
 render
);

catalogBtn.onclick=
 ()=>setMode('catalog');

storeBtn.onclick=
 ()=>setMode('store');

darkBtn.onclick = toggleDark;
collapseAllBtn.onclick = collapseAll;
expandAllBtn.onclick = expandAll;

const toolsBtn =
  document.getElementById('toolsBtn');

const toolsDropdown =
  document.getElementById('toolsDropdown');

toolsBtn.onclick = () => {
  toolsDropdown.classList.toggle('show');
};

document.addEventListener('click', e => {

  if (
    !e.target.closest('#toolsBtn') &&
    !e.target.closest('#toolsDropdown')
  ){
    toolsDropdown.classList.remove('show');
  }

});


if(
 'serviceWorker'
 in navigator
){
 navigator.serviceWorker.register(
  './service-worker.js'
 );

}

(async () => {

 if(
  db.categories.length === 0 &&
  db.products.length === 0
 ){
  await loadCatalog();
 }

 render();

 showAppNotification();

})();

</script>

</body>
</html>
