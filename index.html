<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon"
      sizes="512x512"
      href="icon-512.png">

<link rel="apple-touch-icon"
      sizes="192x192"
      href="icon-192.png">

<meta name="theme-color" content="#4f46e5">

<title>SmartCourses</title>

<style>

:root{
 --bg:#f4f6fb;
 --card:#ffffff;
 --text:#111827;
 --primary:#4f46e5;
}

body.dark{
 --bg:#111827;
 --card:#1f2937;
 --text:#f9fafb;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Segoe UI,sans-serif;
 background:var(--bg);
 color:var(--text);
}

header{
  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #6366f1
    );

  padding:20px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-top{
  margin-bottom:16px;
}

.header-top h1{
  color:white;
  margin:0;
  font-size:1.7rem;
  font-weight:700;
}

.search-container{
  margin-bottom:16px;
}

#search{
  width:100%;
  max-width:none;
  border:none;
  padding:14px 18px;
  border-radius:16px;
  font-size:1rem;

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.08);
}

.header-nav{
  display:flex;
  gap:8px;
}

.context-actions{

  position:fixed;

  right:16px;
  bottom:110px;
	
  z-index:998;

}

.context-actions button{

  width:54px;
  height:54px;

  border-radius:50%;

  background:#4f46e5;

  color:white;

  border:none;

  font-size:22px;

  box-shadow:
    0 8px 24px rgba(79,70,229,.35);

}

.header-nav > button,
#toolsWrapper{
  flex:1;
}

.header-nav button{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;

  transition:
    background .25s,
    transform .25s,
    box-shadow .25s;

  min-height:60px;
  padding:10px 6px;

  border-radius:14px;
  background:white;

  font-size:12px;
  font-weight:600;
  line-height:1.1;
}
	
.nav-icon{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  font-size:22px;
  transition:.2s;
}
	
.nav-label{
  font-size:.70rem;
  font-weight:700;
}
	
button,
input{
 padding:10px;
 border-radius:10px;
 border:1px solid #ccc;
}

button{
  cursor:pointer;
  border:none;
  transition:.2s;
}

.main{
 max-width:1200px;
 margin:auto;
 padding:16px;
}

.card{
  background:var(--card);

  border-radius:20px;

  padding:18px;

  margin-bottom:16px;

  box-shadow:
    0 4px 20px rgba(0,0,0,.04);
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.grow{
 flex:1;
}

.item{
 display:flex;
 gap:8px;
 align-items:center;
 padding:8px 0;
}

.done{
 text-decoration:line-through;
 opacity:.5;
}

.active{
  background:#22c55e !important;
  color:white;

  box-shadow:
    0 8px 18px rgba(34,197,94,.35);

  transform:scale(1.03);
}

.active .nav-label{
  color:white;
}

.active .nav-icon{
  transform:scale(1.1);
}
	
.disabled-btn{
  opacity:.45;
  filter:grayscale(100%);
  pointer-events:none;
}

.meta{
 font-size:.8rem;
 opacity:.75;
}

.progress{
 height:14px;
 background:#ddd;
 border-radius:12px;
 overflow:hidden;
}

.progress div{
 background:#22c55e;
 height:100%;
 transition:width .4s ease;
}

.favorite-btn{
 min-width:40px;
}

.qty-btn{
 min-width:32px;
}

.dropdown{

  display:none;

  position:absolute;

  top:calc(100% + 8px);
  right:0;

  background:var(--card);

  border-radius:16px;

  box-shadow:
    0 12px 30px rgba(0,0,0,.15);

  padding:8px;

  min-width:240px;

  z-index:9999;

  opacity:0;

  transform:translateY(10px);

  transition:
    opacity .18s ease,
    transform .18s ease;

  pointer-events:none;

}

#quickActionsMenu{

  position:fixed;

  right:16px;
  bottom:145px;

  top:auto;

  z-index:9999;

}
	
.dropdown button{
  display:block;
  width:100%;
  margin-bottom:6px;
  text-align:left;
}

.dropdown button:last-child{
  margin-bottom:0;
}

.dropdown.show{

  display:block;

  opacity:1;

  transform:translateY(0);

  pointer-events:auto;
}

.product-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.product-main{
  flex:1;
  min-width:0;
}

.product-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

@media (max-width:768px){

  .product-name{
    font-size:1rem;
  }

  .product-actions{
    gap:4px;
  }

  .qty-btn,
  .favorite-btn{
    width:40px;
    height:40px;
    min-width:40px;
  }

}

.product-name{
 font-size:1rem;
 font-weight:600;
}

.product-meta{
 font-size:.85rem;
 opacity:.7;
 margin-top:4px;
}

.badge{
 display:inline-block;
 padding:3px 8px;
 border-radius:999px;
 font-size:.75rem;
 font-weight:600;
 margin-left:8px;
}

.badge-warning{
 background:#fef3c7;
 color:#92400e;
}

.qty-btn{
  width:36px;
  height:36px;

  border-radius:10px;

  background:#f3f4f6;
}

.product-actions strong{
  min-width:24px;
  text-align:center;
}

.favorite-active{
 color:#facc15;
}

.category-header{
  transition:0.2s;
}

.category-header:active{
  background:rgba(79,70,229,.08);
}

@media (hover:hover){

  .category-card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
  }

}

.category-icon{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 width:38px;
 height:38px;
 border-radius:50%;
 background:#eef2ff;
 margin-right:10px;
 font-size:20px;
}

.category-count{
 background:#e0e7ff;
 color:#4338ca;
 border-radius:999px;
 padding:4px 10px;
 font-size:.75rem;
 font-weight:700;
 margin-left:10px;
}

.category-card{
  overflow:hidden;
}

#toolsBtn{
  width:100%;
}

.badge-count{
  position:absolute;
  top:-6px;
  right:-12px;

  background:#ef4444;
  color:white;

  min-width:18px;
  height:18px;

  border-radius:999px;

  font-size:.7rem;
  font-weight:700;

  display:flex;
  align-items:center;
  justify-content:center;
}

#storeBtn{
  position:relative;
}

.category-arrow{
  font-size:18px;
  width:24px;
  text-align:center;
  flex-shrink:0;
}

.category-arrow.open{
  transform:rotate(90deg);
}

#stats{
  margin-bottom:16px;
}

#progressCard{
  padding:24px;
}

.category-header h3{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:0;
  width:100%;
}

.category-header h3 .category-title{
  flex:1;
  min-width:0;
  white-space:normal;
}

@media(max-width:768px){

  .main{
    padding-bottom:140px;
  }

}
	
@media(max-width:768px){

  .category-header h3{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
  }

  .category-count{
    margin-left:0;
  }

}

.version-info{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid #e5e7eb;
  text-align:center;
  font-size:.8rem;
  opacity:.65;
  font-weight:600;
  cursor:default;
  user-select:none;
}

.input-error{
  border:2px solid #ef4444 !important;
  box-shadow:0 0 0 3px rgba(239,68,68,.15);
}

.menu-day{
 background:#f8fafc;
 border:1px solid #e5e7eb;
 border-radius:16px;
 padding:16px;
 margin-bottom:14px;
}

.menu-title{
 display:flex;
 align-items:center;
 gap:10px;
 margin-bottom:12px;
 font-weight:700;
 font-size:1rem;
 color:#4338ca;
}

.menu-slot{
 margin-top:8px;
}

.menu-select{
 width:100%;
 padding:12px;
 border:1px solid #d1d5db;
 border-radius:12px;
 background:white;
 margin-top:6px;
}

body.dark .menu-day{
 background:#1f2937;
 border-color:#374151;
}

body.dark .menu-select{
 background:#111827;
 color:white;
 border-color:#4b5563;
}

.back-link{
  margin-top:12px;
  text-align:center;
  color:#4f46e5;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.back-link:hover{
  opacity:.8;
}

.back-link:active{
  transform:scale(.98);
}

header{
  transition:
    padding .25s ease,
    transform .25s ease;
}

.header-top h1{
  transition:
    font-size .25s ease;
}

.search-container{
  transition:
    opacity .2s ease,
    max-height .25s ease;
}

body.header-scrolled header{
  padding:10px 16px;
}

body.header-scrolled .header-top{
  margin-bottom:4px;
}

body.header-scrolled .header-top h1{
  font-size:1.15rem;
}

body.header-scrolled .header-nav button{
  min-height:48px;
}

body.header-scrolled .nav-icon{
  font-size:18px;
}

body.header-scrolled .nav-label{
  font-size:.65rem;
}

#toolsWrapper{
  position:relative;
  flex:0 0 60px;
}

#toolsBtn{
  min-height:60px;
  padding:0;
}

#toolsBtn .nav-label{
  display:none;
}

#toolsBtn .nav-icon{
  font-size:28px;
}

#familyInfo,
#membersInfo{

  background:rgba(255,255,255,.22);

  backdrop-filter:blur(8px);

  font-weight:700;

  padding:6px 12px;

  border-radius:999px;
}

.header-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}

@media(max-width:768px){

  #quickActionsMenu{

    right:16px;
    bottom:155px;

  }

}
	
@media(max-width:768px){

.header-nav{

  position:fixed;

  bottom:12px;
  left:12px;
  right:12px;

  z-index:999;

  background:white;

  border-radius:20px;

  padding:6px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.18);
}

.main{
  padding-bottom:100px;
}

.nav-label{
  display:none;
}

.header-nav button{
  min-height:50px;
}
}

@media(max-width:768px){

  .dropdown{

    bottom:70px;
    top:auto;

    right:0;

    max-height:70vh;
    overflow:auto;

  }

}

#headerInfos{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:6px;
}

@media(max-width:768px){

  .header-top{
    display:block;
  }

  #headerInfos{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:nowrap;
    margin-top:8px;
    overflow-x:auto;
  }

  #familyInfo,
  #membersInfo{
    flex-shrink:0;
  }

}

header{
  transition:
    transform .25s ease,
    padding .25s ease;
}

#headerContent{
transform-origin:top;
  transition:
    transform .25s ease,
    opacity .25s ease;

}

.header-nav{
  z-index:999;
}
	
body.header-hidden #headerContent{

  transform:translateY(-120%);

  opacity:0;

  pointer-events:none;

}
	
</style>
      
</head>

<body>

<header>

<div id="headerContent">

  <div class="header-top">

    <h1 id="headerTitle">SmartCourses</h1>

    <div id="headerInfos">

      <div id="familyInfo"></div>

      <div id="membersInfo"></div>

    </div>

  </div>

  <div
    id="searchContainer"
    class="search-container">

    <input
      id="search"
      placeholder="🔍 Rechercher un produit..."
    >

  </div>

</div>

<div class="header-nav">

  <button id="catalogBtn" title="Catalogue">
    <span class="nav-icon">📝</span>
    <span class="nav-label">Catalogue</span>
  </button>

  <button id="storeBtn" title="Courses">
    <span class="nav-icon">🛒</span>
    <span class="nav-label">Courses</span>
  </button>

  <button id="menuBtn" title="Menu">
    <span class="nav-icon">🍽️</span>
    <span class="nav-label">Menu</span>
  </button>

  <button id="budgetBtnHeader" title="Budget">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Budget</span>
  </button>

 <div id="toolsWrapper">

  <button id="toolsBtn" title="Outils">
   <span class="nav-icon">⚙️</span>
	<span class="nav-label">Outils</span>
  </button>

  <div id="toolsDropdown" class="dropdown">

<button id="familyConfigBtn">
  🏡 Configuration du foyer
</button>
	  
    <button id="editCatalogBtn">
      ✏️ Éditer catalogue
    </button>

    <button id="editMealsBtn">
      🍽️ Éditer repas
    </button>

    <button id="darkBtn">
      🌙 Mode sombre
    </button>

    <button id="copyrightBtn">
      ℹ️ À propos
    </button>

    <div id="versionInfo"
         class="version-info">
    </div>

  </div>

</div>
	</div>

<div id="contextActions"
     class="context-actions">
</div>

<div
 id="quickActionsMenu"
 class="dropdown">
</div>

</header>

<div class="main">

<div
 id="progressCard"
 class="card"
 style="display:none">

 <div id="stats"></div>

 <div class="progress">
  <div id="bar"></div>
 </div>

</div>

<div
 id="actions"
 class="card">
</div>

<div id="app"></div>

</div>

<script type="module">

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
	
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1pO-f0uxEGtgzgKPlEagdpZijvnCbSr0",
  authDomain: "smartcourses-cc831.firebaseapp.com",
  projectId: "smartcourses-cc831",
  storageBucket: "smartcourses-cc831.firebasestorage.app",
  messagingSenderId: "151572766736",
  appId: "1:151572766736:web:3ece6663ed2e88d1756a95"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const firestore = getFirestore(app);

window.firestore = firestore;

try {

  const credential =
    await signInAnonymously(auth);

  window.firebaseUser =
    credential.user;

window.currentUser =
  credential.user;
	
const userRef =
  doc(
    firestore,
    "users",
    credential.user.uid
  );

const userSnap =
  await getDoc(userRef);

if(!userSnap.exists()){

  await setDoc(
    userRef,
    {
      uid: credential.user.uid,
      familyId: null,
      createdAt:
        new Date().toISOString()
    }
  );

  console.log(
    "Utilisateur créé"
  );

}

const refreshedUserSnap =
  await getDoc(userRef);

const userData =
  refreshedUserSnap.data();

window.familyId =
  userData.familyId || null;

console.log(
  "Family ID :",
  window.familyId
);
	
  console.log(
    "Firebase connecté :",
    credential.user.uid
  );
	window.firebaseReady = true;

} catch(error){

  console.error(
    "Erreur Firebase :",
    error
  );

}

window.setDisplayName =
async function(name){

  name = name.trim();

  if(!name){
    return;
  }

  await setDoc(
    doc(
      firestore,
      "users",
      window.currentUser.uid
    ),
    {
      displayName:name
    },
    {
      merge:true
    }
  );

  window.displayName = name;

};
	
function generateFamilyCode(){

  return Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();

}

window.createFamily =
async function(
 name,
 familyName
){

  await setDisplayName(name);

  const code =
    generateFamilyCode();

await setDoc(
  doc(
    firestore,
    "families",
    code
  ),
  {
    code,

    familyName: familyName,

    owner:{
      uid:window.currentUser.uid,
      name:name
    },

    members:{
      [window.currentUser.uid]:{
        name:name,
        joinedAt:
          new Date().toISOString()
      }
    },

    createdAt:
      new Date().toISOString(),

    db: getSharedDb()
  }
);
	
  await setDoc(
    doc(
      firestore,
      "users",
      window.currentUser.uid
    ),
    {
      familyId:code
    },
    {
      merge:true
    }
  );

  window.familyId = code;

await loadFamilyData();

window.realtimeStarted =
  false;

window.startRealtimeSync();

db.showFamilyConfig = true;

db.familyStep = 99;

db.showMenuView = false;
db.showBudgetView = false;
db.waitingForAmount = false;

db.mode = 'catalog';

await save();
	
render();
};

window.joinFamily =
async function(code,name){

  code =
    code.trim()
        .toUpperCase();

  await setDisplayName(name);

  const familyRef =
    doc(
      firestore,
      "families",
      code
    );

  const familySnap =
    await getDoc(familyRef);

  if(!familySnap.exists()){

  const input =
    document.getElementById("familyCode");

  if(input){
    input.classList.add("input-error");
    input.focus();
  }

  return;
}

  const family =
    familySnap.data();

  const members =
    family.members || {};

  members[
    window.currentUser.uid
  ] = {

    name:name,

    joinedAt:
      new Date().toISOString()

  };

  await setDoc(
    familyRef,
    {
      members
    },
    {
      merge:true
    }
  );

  await setDoc(
    doc(
      firestore,
      "users",
      window.currentUser.uid
    ),
    {
      familyId:code
    },
    {
      merge:true
    }
  );

  window.familyId = code;

  await loadFamilyData();

 window.realtimeStarted = false;

window.startRealtimeSync();

db.showFamilyConfig = true;

db.familyStep = 99;

db.showMenuView = false;
db.showBudgetView = false;
db.waitingForAmount = false;

db.mode = 'catalog';

await save();
	
render();

};

window.loadFamilyData =
async function(){

  if(!window.familyId){

    console.log(
      "Pas de foyer"
    );

    return;
  }

  const familySnap =
    await getDoc(
      doc(
        firestore,
        "families",
        window.familyId
      )
    );

  if(!familySnap.exists()){

    console.log(
      "Foyer introuvable"
    );

    return;
  }

 const familyData =
  familySnap.data();

window.familyName =
  familyData.familyName || "";

window.sharedDb =
  familyData.db;

window.familyMembers =
  familyData.members || {};

  console.log(
    "Données foyer chargées"
  );

  console.log(
    window.sharedDb
  );

};

window.realtimeStarted = false;

window.startRealtimeSync =
function(){

  if(window.realtimeStarted){
    return;
  }

  window.realtimeStarted = true;

  if(!window.familyId){
    return;
  }

  onSnapshot(
    doc(
      firestore,
      "families",
      window.familyId
    ),
    snapshot => {

      if(!snapshot.exists()){
        return;
      }

window.familyName =
  snapshot.data().familyName || "";

window.sharedDb =
  snapshot.data().db;

		window.familyMembers =
  snapshot.data().members || {};

	    if(
	  window.sharedDb &&
	  (
	    window.sharedDb.products?.length > 0 ||
	    window.sharedDb.categories?.length > 0 ||
	    window.sharedDb.meals?.length > 0
	  )
	){
	
	  const uiState = {
  showFamilyConfig: db.showFamilyConfig,
  familyStep: db.familyStep,
  mode: db.mode,
  showMenuView: db.showMenuView,
  showBudgetView: db.showBudgetView,
  waitingForAmount: db.waitingForAmount,
  pendingName: db.pendingName,
categoryState: db.categoryState
};

const categoryState =
  db.categoryState || {};

db = structuredClone(window.sharedDb);

Object.assign(db, uiState);

db.categoryState = categoryState;

Object.keys(db.weeklyMenu).forEach(day => {

  if(db.weeklyMenu[day].collapsed === undefined){

    db.weeklyMenu[day].collapsed = false;

  }

});
			
	}

      render();

      console.log(
        "Synchronisation reçue"
      );

    }
  );

};

window.saveFamilyDb =
async function(data){

  if(!window.familyId){
    return;
  }

  await setDoc(
    doc(
      firestore,
      "families",
      window.familyId
    ),
    {
      db:data
    },
    {
      merge:true
    }
  );

};
	
</script>
	
<script>

function getSharedDb(){

  const sharedWeeklyMenu = {};

  Object.keys(db.weeklyMenu).forEach(day => {

    sharedWeeklyMenu[day] = {
      midi: db.weeklyMenu[day].midi,
      soir: db.weeklyMenu[day].soir
    };

  });

  const sharedCategories =
    db.categories.map(category => ({

      id: category.id,

      name: category.name,

      order: category.order

    }));

  return {

    categories: sharedCategories,

    products: db.products,

    meals: db.meals,

    weeklyMenu: sharedWeeklyMenu,

    shoppingHistory: db.shoppingHistory

}

function daysAgo(date){

 if(!date){

  return 'Jamais acheté';

 }

 const diff=Math.floor(

  (
   Date.now()
   -
   new Date(date).getTime()
  )

  /
  86400000

 );

 if(diff===0){

  return 'Acheté aujourd’hui';

 }

 if(diff===1){

  return 'Acheté hier';

 }

 return 'Acheté il y a '
        +
        diff
        +
        ' jours';

}

function averageRepurchaseDays(product){

 if(
  product.purchaseHistory.length<2
 ){
  return null;
 }

 let total=0;

 for(
  let i=1;
  i<product.purchaseHistory.length;
  i++
 ){

  const previous=
   new Date(
    product.purchaseHistory[
      i-1
    ].date
   );

  const current=
   new Date(
    product.purchaseHistory[
      i
    ].date
   );

  total +=

   (
    current-previous
   )

   /86400000;

 }

 return Math.round(

  total/

  (
   product.purchaseHistory.length-1
  )

 );

}

function daysSinceLastPurchase(
 product
){

 if(
  !product.lastPurchase
 ){
  return null;
 }

 return Math.floor(

  (
   Date.now()
   -
   new Date(
    product.lastPurchase
   )
  )

  /86400000

 );

}

function shouldSuggest(
 product
){

 const average=
  averageRepurchaseDays(
   product
  );

 if(
  average===null
 ){
  return false;
 }

 const elapsed=
  daysSinceLastPurchase(
   product
  );

 if(
  elapsed===null
 ){
  return false;
 }

 return elapsed>=average;

}

function importTxtCatalog(text){

 let currentCategory = null;

 const lines = text
  .split('\n')
  .map(line => line.trim())
  .filter(Boolean);

 lines.forEach(line => {

  if(line.endsWith(':')){

   const categoryName =
    line.slice(0,-1).trim();

   let category =
    db.categories.find(
     c =>
      c.name.toLowerCase() ===
      categoryName.toLowerCase()
    );

   if(!category){

    category = {
      id: uid(),
      name: categoryName,
      order: db.categories.length + 1
    };

    db.categories.push(category);
   }

   currentCategory = category;
   return;
  }

  if(!currentCategory){
   return;
  }

  const exists =
   db.products.some(
    p =>
     p.categoryId === currentCategory.id &&
     p.name.toLowerCase() ===
     line.toLowerCase()
   );

  if(exists){
   return;
  }

  db.products.push({
    id: uid(),
    name: line,
    categoryId: currentCategory.id,
    favorite: false,
    inList: false,
    listQuantity: 1,
    purchased: false,
    frequency: 0,
    lastPurchase: null,
    purchaseHistory: []
  });

 });

 localStorage.setItem(
  'shopping-v1',
  JSON.stringify(db)
);
}

function isShoppingFinished(){

 const total =
  db.products.filter(
   p => p.inList
  ).length;

 const done =
  db.products.filter(
   p => p.inList && p.purchased
  ).length;

 return total > 0 && done === total;

}

async function generateShoppingFromMenu(){

if(db.waitingForAmount){

alert(

"Veuillez d'abord enregistrer le montant des courses en cours."

);

return;

}
	
 const selectedMeals = [];

Object.values(db.weeklyMenu)
 .forEach(day => {

   if(day.midi){
    selectedMeals.push(day.midi);
   }

   if(day.soir){
    selectedMeals.push(day.soir);
   }

 });

 const ingredients =
  new Set();

 selectedMeals.forEach(mealName => {

  const meal =
   db.meals.find(
    m => m.name === mealName
   );

  if(!meal){
   return;
  }

  meal.ingredients.forEach(i =>
   ingredients.add(i)
  );

 });

 ingredients.forEach(ingredient => {

  const product =
   db.products.find(
    p =>
     p.name.toLowerCase()
     === ingredient.toLowerCase()
   );

  if(product){

   product.inList = true;

  }

 });

 db.showMenuView = false;
 db.mode = 'store';

 await save();

await saveShared();

render();

}

async function finishShopping(){

  if(!isShoppingFinished()){
    alert(
      "Tous les produits doivent être récupérés avant l'enregistrement."
    );
    return;
  }

  const amountInput =
    document.getElementById(
      'shoppingAmount'
    );

  const amount =
    parseFloat(
      amountInput?.value || 0
    );

  if(
    !Number.isFinite(amount)
    ||
    amount <= 0
  ){
    amountInput.classList.add(
      'input-error'
    );

    amountInput.focus();

    return;
  }

  db.shoppingHistory.unshift({

    date:
      new Date().toISOString(),

    amount

  });

  db.shoppingHistory =
    db.shoppingHistory.slice(
      0,
      20
    );

  const now =
    new Date().toISOString();

  db.products.forEach(product => {

    if(
      product.inList &&
      product.purchased
    ){

      product.frequency++;

      product.lastPurchase = now;

      product.purchaseHistory.push({

        date: now,

        quantity:
          product.listQuantity

      });

    }

  });

  db.products.forEach(product => {

    if(product.inList){

      product.inList = false;

      product.purchased = false;

      product.listQuantity = 1;

    }

  });

  db.showPurchased = false;
db.showFamilyConfig = false;
  db.showBudgetView = true;

  db.mode = '';

  db.waitingForAmount = false;

  await save();

await saveShared();

render();

}

function familyProgress(step){

  const max = 3;

  const current =
    Math.min(step, max);

  return `
    <div style="margin-bottom:16px;">

      <div style="
        font-size:.85rem;
        font-weight:700;
        margin-bottom:6px;
      ">
        Étape ${current}/${max}
      </div>

      <div style="
        height:10px;
        background:#e5e7eb;
        border-radius:999px;
        overflow:hidden;
      ">
        <div style="
          width:${current*100/max}%;
          height:100%;
          background:#22c55e;
        "></div>
      </div>

    </div>

for(const cat of db.categories){

const isCollapsed =
  db.categoryState[cat.id] ?? true;
	
let items=

 db.products.filter(p=>{

  if(
   p.categoryId!==cat.id
  ){
   return false;
  }

  if(
   !p.name
     .toLowerCase()
     .includes(q)
  ){
   return false;
  }

  return true;

 });

const categoryItems =
 items.filter(
  p => p.inList
 );

const totalItems =
 categoryItems.length;

const remainingItems =
 categoryItems.filter(
  p => !p.purchased
 ).length;

if(db.mode==='store'){

 items=
 items.filter(
  p =>
   p.inList &&
   (
    db.showPurchased ||
    !p.purchased
   )
 );

}

if(
 db.mode === 'store' &&
 !db.showPurchased &&
 remainingItems === 0
){
 continue;
}

if(items.length===0){
 continue;
}
let html =
  '<div class="card category-card" data-id="'+cat.id+'">' +
  '<div class="row category-header" onclick="toggleCategory('+cat.id+')">' +
  '<span class="category-arrow ' +
  (isCollapsed ? '' : 'open') +
  '">❯</span>' +
  '<h3>' +
	'<span class="category-title">' +
	categoryIcon(cat.name) +
	' ' +
	cat.name +
	'</span>' +
	'<span class="category-count">' +
	(
	db.mode === 'store'
    ? (
        remainingItems === 0
          ? '✅ ' + totalItems + ' / ' + totalItems
          : remainingItems + ' / ' + totalItems
      )
    : items.length +
      (items.length > 1
        ? ' produits'
        : ' produit')
	) +
	'</span></h3>';

html+='</div>';
items.sort((a,b)=>{

  // 2. À racheter
  const aSuggest = shouldSuggest(a);
  const bSuggest = shouldSuggest(b);

  if(aSuggest && !bSuggest){
    return -1;
  }

  if(!aSuggest && bSuggest){
    return 1;
  }

  // 3. Déjà dans la liste
  if(a.inList && !b.inList){
    return -1;
  }

  if(!a.inList && b.inList){
    return 1;
  }

  // 4. Tri alphabétique
  return a.name.localeCompare(
    b.name,
    'fr',
    {sensitivity:'base'}
  );

});
if(!isCollapsed){
for(const p of items){

const badgeSuggest =
shouldSuggest(p)
? '<span class="badge badge-warning">🔔</span>'
: '';


if(db.mode==='catalog'){

html +=
'<div class="product-row">'+

'<button class="favorite-btn '+(p.favorite ? 'favorite-active' : '')+'" onclick="toggleFavorite('+p.id+')">'+
(p.favorite ? '⭐' : '☆')+
'</button>'+

'<div class="product-main">'+

'<div class="product-name">'+
p.name+
badgeSuggest+
'</div>'+

'<div class="product-meta">'+
(
p.lastPurchase
? '🕒 '+daysAgo(p.lastPurchase)
: 'Jamais acheté'
)+
'</div>'+

'</div>'+

'<div class="product-actions">'+

(
p.inList
? '<button onclick="toggleList('+p.id+')">✅</button>'
: '<button onclick="addToList('+p.id+')">🛒</button>'
)+

(
p.inList
? '<button class="qty-btn" onclick="decreaseQuantity('+p.id+')">−</button>'+
'<strong>'+getListQuantity(p)+'</strong>'+
'<button class="qty-btn" onclick="increaseQuantity('+p.id+')">+</button>'
: ''
)+

'</div>'+
'</div>';

}
if(db.mode==='store'){

 html+=
 '<div class="item" data-product-id="'+p.id+'">'+

  '<input type="checkbox" '+

  (
   p.purchased
   ? 'checked'
   : ''
  )+

  ' onchange="togglePurchased('+p.id+')">' +

  '<span class="'+

  (
   p.purchased
   ? 'done'
   : ''
  )+

  '">' +

  p.name+

  ' x'+

  getListQuantity(p)+

  '</span>'+

  '</div>';

}

}

}

html+='</div>';

app.innerHTML+=html;

}

}

  await loadMeals();

  if(
    db.categories.length === 0 &&
    db.products.length === 0
  ){
    await loadCatalog();
  }

  const waitFirebase = () =>
    new Promise(resolve => {

      const timer =
        setInterval(() => {

          if(window.firebaseReady){

            clearInterval(timer);

            resolve();

          }

        },100);

    });

 await waitFirebase();

if(
  db.pendingName &&
  !window.familyId
){
  db.familyStep = 2;
}

 if(window.familyId){

  await window.loadFamilyData();

  if(
    window.sharedDb &&
    (
      window.sharedDb.products?.length > 0 ||
      window.sharedDb.categories?.length > 0 ||
      window.sharedDb.meals?.length > 0
    )
  ){

 const uiState = {
  showFamilyConfig: db.showFamilyConfig,
  familyStep: db.familyStep,
  mode: db.mode,
  showMenuView: db.showMenuView,
  showBudgetView: db.showBudgetView,
  waitingForAmount: db.waitingForAmount,
  pendingName: db.pendingName,
	categoryState: db.categoryState
};

const categoryState =
  db.categoryState || {};

db = structuredClone(window.sharedDb);

Object.assign(db, uiState);

Object.keys(db.weeklyMenu).forEach(day => {

  if(db.weeklyMenu[day].collapsed === undefined){
    db.weeklyMenu[day].collapsed = false;
  }

});

  }else{

    await loadMeals();
    await loadCatalog();

    await saveFamilyDb(db);

  }

  window.startRealtimeSync();

}

  render();

  showAppNotification();

})();

let lastScrollY = 0;

window.addEventListener(
  'scroll',
  () => {

    const currentScrollY =
      window.scrollY;

    // Header compact
    if(currentScrollY > 30){

      document.body.classList.add(
        'header-scrolled'
      );

    }else{

      document.body.classList.remove(
        'header-scrolled'
      );

    }

    // Descente => cacher
    if(
      currentScrollY > lastScrollY &&
      currentScrollY > 100
    ){

      document.body.classList.add(
        'header-hidden'
      );

    }

    // Remontée => montrer
    else{

      document.body.classList.remove(
        'header-hidden'
      );

    }

    lastScrollY =
      currentScrollY;

  }
);
