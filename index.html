
<div
 id="progressCard"
 class="card"
 style="display:none">

 <div id="stats"></div>

 <div class="progress">
  <div id="bar"></div>
 </div>

</div>

<div
 id="actions"
 class="card">
</div>

<div id="app"></div>

</div>

<script>

const APP_NOTIFICATION = {
  version: '1.0.6',
  title: '🆕 Nouvelle version',
  message: 'Ajout de nouvelles fonctionnalités'
};

const defaults={

 mode:'catalog',

 dark:false,

 showFavorites:false,

 categories:[],

 products:[]

};

let db;

try{

 db=
  JSON.parse(
   localStorage.getItem(
    'shopping-v62'
   )
  );

}catch(e){

 db=null;

}

if(!db){

 db=defaults;

}

const isMobile =
 window.matchMedia(
  '(pointer:coarse)'
 ).matches;

if(db.showFavorites===undefined){

 db.showFavorites=false;

}

db.categories =
 Array.isArray(db.categories)
 ? db.categories
 : [];

db.products =
 Array.isArray(db.products)
 ? db.products
 : [];

db.categories.forEach(category=>{

 if(category.order===undefined){

  category.order=0;

 }

 if(category.collapsed===undefined){

  category.collapsed=true;

 }

});

db.products.forEach(product=>{

 if(product.favorite===undefined){

  product.favorite=false;

 }

 if(product.inList===undefined){

  product.inList=false;

 }

 if(product.listQuantity===undefined){

  product.listQuantity=1;

 }

 if(product.purchased===undefined){

  product.purchased=false;

 }

 if(product.frequency===undefined){

  product.frequency=0;

 }

 if(product.lastPurchase===undefined){

  product.lastPurchase=null;

 }

 if(
  !Array.isArray(
   product.purchaseHistory
  )
 ){

  product.purchaseHistory=[];

 }

});

function save(){

 localStorage.setItem(
  'shopping-v62',
  JSON.stringify(db)
 );

}

function uid(){

 return Date.now() + Math.random();

}

function getProductById(id){

 return db.products.find(
  p=>p.id===id
 );

}

function getCategoryById(id){

 return db.categories.find(
  c=>c.id===id
 );

}

function setMode(mode){

 db.mode=mode;

 save();

 render();

}

function daysAgo(date){

 if(!date){

  return 'Jamais acheté';

 }

 const diff=Math.floor(

  (
   Date.now()
   -
   new Date(date).getTime()
  )

  /
  86400000

 );

 if(diff===0){

  return 'Acheté aujourd’hui';

 }

 if(diff===1){

  return 'Acheté hier';

 }

 return 'Acheté il y a '
        +
        diff
        +
        ' jours';

}

function sortCategories(){

 db.categories.sort(
  (a,b)=>
   (a.order||0)
   -
   (b.order||0)
 );

}

function toggleFavorite(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.favorite=
  !product.favorite;

 save();

 render();

}

function toggleList(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.inList=
  !product.inList;

 if(!product.inList){

  product.listQuantity=1;

  product.purchased=false;

 }

 save();

 render();

}

function increaseQuantity(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.listQuantity=
  (product.listQuantity||1)+1;

 save();

 render();

}

function decreaseQuantity(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 if(
  product.listQuantity>1
 ){

  product.listQuantity--;

 }

 save();

 render();

}

function getListQuantity(product){

 return product.listQuantity || 1;

}

function togglePurchased(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 if(!product.purchased){

  const now=
   new Date().toISOString();

  product.frequency++;

  product.lastPurchase=
   now;

  product.purchaseHistory.push({

   date:now,

   quantity:
    product.listQuantity

  });

 }

 product.purchased=
  !product.purchased;

 save();

 render();

}

function averageRepurchaseDays(product){

 if(
  product.purchaseHistory.length<2
 ){
  return null;
 }

 let total=0;

 for(
  let i=1;
  i<product.purchaseHistory.length;
  i++
 ){

  const previous=
   new Date(
    product.purchaseHistory[
      i-1
    ].date
   );

  const current=
   new Date(
    product.purchaseHistory[
      i
    ].date
   );

  total +=

   (
    current-previous
   )

   /86400000;

 }

 return Math.round(

  total/

  (
   product.purchaseHistory.length-1
  )

 );

}

function daysSinceLastPurchase(
 product
){

 if(
  !product.lastPurchase
 ){
  return null;
 }

 return Math.floor(

  (
   Date.now()
   -
   new Date(
    product.lastPurchase
   )
  )

  /86400000

 );

}

function shouldSuggest(
 product
){

 const average=
  averageRepurchaseDays(
   product
  );

 if(
  average===null
 ){
  return false;
 }

 const elapsed=
  daysSinceLastPurchase(
   product
  );

 if(
  elapsed===null
 ){
  return false;
 }

 return elapsed>=average;

}

function importTxtCatalog(text){

 let currentCategory = null;

 const lines = text
  .split('\n')
  .map(line => line.trim())
  .filter(Boolean);

 lines.forEach(line => {

  if(line.endsWith(':')){

   const categoryName =
    line.slice(0,-1).trim();

   let category =
    db.categories.find(
     c =>
      c.name.toLowerCase() ===
      categoryName.toLowerCase()
    );

   if(!category){

    category = {
      id: uid(),
      name: categoryName,
      order: db.categories.length + 1,
      collapsed: false
    };

    db.categories.push(category);
   }

   currentCategory = category;
   return;
  }

  if(!currentCategory){
   return;
  }

  const exists =
   db.products.some(
    p =>
     p.categoryId === currentCategory.id &&
     p.name.toLowerCase() ===
     line.toLowerCase()
   );

  if(exists){
   return;
  }

  db.products.push({
    id: uid(),
    name: line,
    categoryId: currentCategory.id,
    favorite: false,
    inList: false,
    listQuantity: 1,
    purchased: false,
    frequency: 0,
    lastPurchase: null,
    purchaseHistory: []
  });

 });

 save();
}

function toggleCategory(id){

 const category=
  getCategoryById(id);

 if(!category){
  return;
 }

 category.collapsed=
  !category.collapsed;

 save();

 render();

}

function toggleFavorites(){

 db.showFavorites=
  !db.showFavorites;

 save();

 render();

}

function addToList(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.inList=true;

 if(!product.listQuantity){

  product.listQuantity=1;

 }

 save();

 render();

}

function categoryIcon(name){

 const n = name.toLowerCase();

 // Fruits et légumes
 if(
  n.includes('fruit') ||
  n.includes('légume') ||
  n.includes('legume')
 ){
  return '🥬';
 }

 // Viandes
 if(
  n.includes('viande') ||
  n.includes('boucherie') ||
  n.includes('boeuf') ||
  n.includes('porc') ||
  n.includes('poulet')
 ){
  return '🥩';
 }

 // Poissons
 if(
  n.includes('poisson') ||
  n.includes('saumon') ||
  n.includes('thon') ||
  n.includes('cabillaud')
 ){
  return '🐟';
 }

 // Produits laitiers
 if(
  n.includes('lait') ||
  n.includes('fromage') ||
  n.includes('yaourt') ||
  n.includes('beurre')
 ){
  return '🥛';
 }

 // Boulangerie
 if(
  n.includes('pain') ||
  n.includes('boulangerie') ||
  n.includes('baguette')
 ){
  return '🥖';
 }

// Petit-déjeuner
if(
 n.includes('petit déjeuner') ||
 n.includes('petit-déjeuner') ||
 n.includes('petit déjeuner') ||
 n.includes('muesli') ||
 n.includes('céréale') ||
 n.includes('cereale')
){
 return '🥣';
}

 // Café / Thé
 if(
  n.includes('café') ||
  n.includes('cafe') ||
  n.includes('thé') ||
  n.includes('the')
 ){
  return '☕';
 }

 // Boissons
 if(
  n.includes('boisson') ||
  n.includes('eau') ||
  n.includes('jus') ||
  n.includes('soda')
 ){
  return '🥤';
 }

 // Épicerie salée
 if(
  n.includes('épicerie salée') ||
  n.includes('epicerie salee') ||
  n.includes('riz') ||
  n.includes('pâtes') ||
  n.includes('pates') ||
  n.includes('semoule')
 ){
  return '🍝';
 }

 // Épicerie sucrée
 if(
  n.includes('épicerie sucrée') ||
  n.includes('epicerie sucree') ||
  n.includes('sucre') ||
  n.includes('farine')
 ){
  return '🧁';
 }

 // Chocolat
 if(
  n.includes('chocolat') ||
  n.includes('pépite') ||
  n.includes('pepite') ||
  n.includes('cacao')
 ){
  return '🍫';
 }

 // Goûter
 if(
  n.includes('goûter') ||
  n.includes('gouter') ||
  n.includes('biscuit') ||
  n.includes('cookie')
 ){
  return '🍪';
 }

 // Bonbons
 if(
  n.includes('bonbon') ||
  n.includes('confiserie')
 ){
  return '🍬';
 }

 // Apéro
 if(
  n.includes('apéro') ||
  n.includes('apero') ||
  n.includes('snack')
 ){
  return '🍿';
 }

 // Épices
 if(
  n.includes('épice') ||
  n.includes('epice') ||
  n.includes('sel') ||
  n.includes('poivre')
 ){
  return '🧂';
 }

 // Huiles
 if(
  n.includes('huile') ||
  n.includes('olive')
 ){
  return '🍶';
 }

 // Vinaigres
 if(
  n.includes('vinaigre')
 ){
  return '🍶';
 }

 // Sauces
 if(
  n.includes('sauce') ||
  n.includes('ketchup') ||
  n.includes('mayonnaise') ||
  n.includes('mayo')
 ){
  return '🥫';
 }

 // Surgelés
 if(
  n.includes('surgelé') ||
  n.includes('surgele') ||
  n.includes('congelé') ||
  n.includes('congele')
 ){
  return '❄️';
 }

 // Pharmacie
 if(
  n.includes('pharmacie') ||
  n.includes('médicament') ||
  n.includes('medicament')
 ){
  return '🩹';
 }

 // Hygiène
 if(
  n.includes('hygiène') ||
  n.includes('hygiene')
 ){
  return '🧴';
 }

 // Beauté
 if(
  n.includes('beauté') ||
  n.includes('beaute')
 ){
  return '💄';
 }

 // Ménage
 if(
  n.includes('ménage') ||
  n.includes('menage') ||
  n.includes('entretien')
 ){
  return '🧽';
 }

 // Bébé
 if(
  n.includes('bébé') ||
  n.includes('bebe')
 ){
  return '🍼';
 }

 return '📦';
}

async function loadCatalog(){

 try{

  const response =
   await fetch('catalogue.txt');

  const text =
   await response.text();

  importTxtCatalog(text);

 }catch(error){

  console.error(
   'Impossible de charger catalogue.txt',
   error
  );

 }

}

function closeToolsMenu(){
  document
    .getElementById('toolsDropdown')
    .classList.remove('show');
}

function collapseAll(){
  db.categories.forEach(
    c => c.collapsed = true
  );

  save();
  closeToolsMenu();
  render();
}

function expandAll(){
  db.categories.forEach(
    c => c.collapsed = false
  );

  save();
  closeToolsMenu();
  render();
}

function toggleDark(){
  db.dark = !db.dark;

  save();
  closeToolsMenu();
  render();
}

function resetApplication(){

  const confirmReset = confirm(
    'Réinitialiser la liste de courses ?'
  );

  if(!confirmReset){
    return;
  }

  db.products.forEach(product => {

    product.inList = false;
    product.purchased = false;
    product.listQuantity = 1;

  });

  save();

  closeToolsMenu();

  render();
}

function showAppNotification(){

  const seenVersion =
    localStorage.getItem(
      'notification-version'
    );

  if(
    seenVersion === APP_NOTIFICATION.version
  ){
    return;
  }

setTimeout(() => {
  alert(
    APP_NOTIFICATION.title +
    '\n\n' +
    APP_NOTIFICATION.message
  );
}, 500);


  localStorage.setItem(
    'notification-version',
    APP_NOTIFICATION.version
  );

}

function render(){

document.body.className=
db.dark
? 'dark'
: '';

const cartCount =
 db.products.filter(
  p => p.inList
 ).length;

storeBtn.innerHTML =
 '🛒 Magasin ' +
 (
   cartCount > 0
   ? '<span class="badge-count">'+cartCount+'</span>'
   : ''
 );

catalogBtn.className=
db.mode==='catalog'
? 'active'
: '';
storeBtn.className=
db.mode==='store'
? 'active'
: '';

actions.style.display =
  db.mode === 'catalog'
  ? 'block'
  : 'none';

actions.innerHTML =
db.mode === 'catalog'
? `
<div class="row">
  <button
    id="favoritesBtn"
    class="${db.showFavorites ? 'active' : ''}"
    onclick="toggleFavorites()"
  >
    ⭐ Favoris
  </button>
</div>
`
: '';

const q=
(
search.value
||
''
).toLowerCase();
app.innerHTML='';
if(db.mode==='store'){
progressCard.style.display=
'block';
const total=
db.products.filter(
p=>p.inList
).length;
const done=
db.products.filter(
p=>
p.inList
&&
p.purchased
).length;
stats.textContent=
done+
' / '+
total+
' articles récupérés';
bar.style.width=
(
total
?
done*100/total
:
0
)+'%';
}else{
progressCard.style.display=
'none';
}
sortCategories();
for(const cat of db.categories){
let items=

 db.products.filter(p=>{

  if(
   p.categoryId!==cat.id
  ){
   return false;
  }

  if(
   !p.name
     .toLowerCase()
     .includes(q)
  ){
   return false;
  }

  if(
   db.showFavorites
   &&
   !p.favorite
  ){
   return false;
  }

  return true;

 });

if(db.mode==='store'){
  items = items
    .filter(p => p.inList)
    .sort((a,b) => {
      // Non achetés en premier
      if(a.purchased !== b.purchased){
        return a.purchased ? 1 : -1;
      }

      // Puis tri alphabétique
      return a.name.localeCompare(
        b.name,
        'fr',
        {sensitivity:'base'}
      );
    });
}

if(items.length===0){
 continue;
}
let html =
  '<div class="card category-card" data-id="'+cat.id+'">' +
  '<div class="row category-header" onclick="toggleCategory('+cat.id+')">' +
  '<span class="category-arrow ' +
  (cat.collapsed ? '' : 'open') +
  '">❯</span>' +
  '<h3 class="grow">' +
  categoryIcon(cat.name)+' '+cat.name+
  '<span class="category-count">' +
  items.length +
  '</span></h3>';

html+='</div>';
if(!cat.collapsed){
for(const p of items){

const badgeSuggest =
shouldSuggest(p)
? '<span class="badge badge-warning">🔔 À racheter</span>'
: '';


if(db.mode==='catalog'){

html +=
'<div class="product-row">'+

'<button class="favorite-btn '+(p.favorite ? 'favorite-active' : '')+'" onclick="toggleFavorite('+p.id+')">'+
(p.favorite ? '⭐' : '☆')+
'</button>'+

'<div class="product-main">'+

'<div class="product-name">'+
p.name+
badgeSuggest+
'</div>'+

'<div class="product-meta">'+
(
p.lastPurchase
? 'Dernier achat : '+daysAgo(p.lastPurchase)
: 'Jamais acheté'
)+
'</div>'+

'</div>'+

'<div class="product-actions">'+

(
p.inList
? '<button onclick="toggleList('+p.id+')">✅</button>'
: '<button onclick="addToList('+p.id+')">🛒</button>'
)+

(
p.inList
? '<button class="qty-btn" onclick="decreaseQuantity('+p.id+')">−</button>'+
'<strong>'+getListQuantity(p)+'</strong>'+
'<button class="qty-btn" onclick="increaseQuantity('+p.id+')">+</button>'
: ''
)+

'</div>'+
'</div>';

}
if(db.mode==='store'){

 html+=

  '<div class="item">'+

  '<input type="checkbox" '+

  (
   p.purchased
   ? 'checked'
   : ''
  )+

  ' onchange="togglePurchased('+p.id+')">' +

  '<span class="'+

  (
   p.purchased
   ? 'done'
   : ''
  )+

  '">' +

  p.name+

  ' x'+

  getListQuantity(p)+

  '</span>'+

  '</div>';

}

}

}

html+='</div>';

app.innerHTML+=html;

}

}
document
  .getElementById('search')
  .addEventListener(
    'input',
    render
  );

catalogBtn.onclick=
 ()=>setMode('catalog');

const resetBtn =
  document.getElementById('resetBtn');

console.log(
 document.getElementById('resetBtn')
);

resetBtn.onclick =
  resetApplication;

storeBtn.onclick=
 ()=>setMode('store');

darkBtn.onclick = toggleDark;
collapseAllBtn.onclick = collapseAll;
expandAllBtn.onclick = expandAll;

const toolsBtn =
  document.getElementById('toolsBtn');

const toolsDropdown =
  document.getElementById('toolsDropdown');

toolsBtn.onclick = () => {
  toolsDropdown.classList.toggle('show');
};

document.addEventListener('click', e => {

  if (
    !e.target.closest('#toolsBtn') &&
    !e.target.closest('#toolsDropdown')
  ){
    toolsDropdown.classList.remove('show');
  }

});


if(
 'serviceWorker'
 in navigator
){
 navigator.serviceWorker.register(
  './service-worker.js'
 );

}

(async () => {

 if(
  db.categories.length === 0 &&
  db.products.length === 0
 ){
  await loadCatalog();
 }

 render();

 showAppNotification();

})();

</script>

</body>
</html>
