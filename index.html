<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon"
      sizes="512x512"
      href="icon-512.png">

<link rel="apple-touch-icon"
      sizes="192x192"
      href="icon-192.png">

<meta name="theme-color" content="#4f46e5">

<title>SmartCourses</title>

<style>

:root{
 --bg:#f4f6fb;
 --card:#ffffff;
 --text:#111827;
 --primary:#4f46e5;
}

body.dark{
 --bg:#111827;
 --card:#1f2937;
 --text:#f9fafb;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Segoe UI,sans-serif;
 background:var(--bg);
 color:var(--text);
}

header{
  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #6366f1
    );

  padding:20px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-top{
  margin-bottom:16px;
}

.header-top h1{
  color:white;
  margin:0;
  font-size:1.7rem;
  font-weight:700;
}

.search-container{
  margin-bottom:16px;
}

#search{
  width:100%;
  max-width:none;
  border:none;
  padding:14px 18px;
  border-radius:16px;
  font-size:1rem;

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.08);
}

.header-nav{
  display:flex;
  gap:8px;
}

.context-actions{

  display:none;

  justify-content:center;

  gap:10px;

  margin-top:10px;

}

.context-actions button{

  width:44px;
  height:44px;

  border-radius:50%;

  background:white;

  font-size:18px;

  font-weight:bold;
}

.header-nav > button,
#toolsWrapper{
  flex:1;
}

.header-nav button{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;

  transition:
    background .25s,
    transform .25s,
    box-shadow .25s;

  min-height:60px;
  padding:10px 6px;

  border-radius:14px;
  background:white;

  font-size:12px;
  font-weight:600;
  line-height:1.1;
}
	
.nav-icon{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  font-size:22px;
  transition:.2s;
}
	
.nav-label{
  font-size:.70rem;
  font-weight:700;
}
	
button,
input{
 padding:10px;
 border-radius:10px;
 border:1px solid #ccc;
}

button{
  cursor:pointer;
  border:none;
  transition:.2s;
}

.main{
 max-width:1200px;
 margin:auto;
 padding:16px;
}

.card{
  background:var(--card);

  border-radius:20px;

  padding:18px;

  margin-bottom:16px;

  box-shadow:
    0 4px 20px rgba(0,0,0,.04);
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.grow{
 flex:1;
}

.item{
 display:flex;
 gap:8px;
 align-items:center;
 padding:8px 0;
}

.done{
 text-decoration:line-through;
 opacity:.5;
}

.active{
  background:#22c55e !important;
  color:white;

  box-shadow:
    0 8px 18px rgba(34,197,94,.35);

  transform:scale(1.03);
}

.active .nav-label{
  color:white;
}

.active .nav-icon{
  transform:scale(1.1);
}
	
.disabled-btn{
  opacity:.45;
  filter:grayscale(100%);
  pointer-events:none;
}

.meta{
 font-size:.8rem;
 opacity:.75;
}

.progress{
 height:14px;
 background:#ddd;
 border-radius:12px;
 overflow:hidden;
}

.progress div{
 background:#22c55e;
 height:100%;
 transition:width .4s ease;
}

.favorite-btn{
 min-width:40px;
}

.qty-btn{
 min-width:32px;
}

.dropdown{
  display:none;

  position:absolute;

  top:calc(100% + 8px);
  right:0;

  background:var(--card);

  border-radius:16px;

  box-shadow:
    0 12px 30px rgba(0,0,0,.15);

  padding:8px;

  min-width:240px;

  z-index:9999;
}

.dropdown button{
  display:block;
  width:100%;
  margin-bottom:6px;
  text-align:left;
}

.dropdown button:last-child{
  margin-bottom:0;
}

.dropdown.show{
  display:block;
}



.product-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.product-main{
  flex:1;
  min-width:0;
}

.product-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

@media (max-width:768px){

  .product-name{
    font-size:1rem;
  }

  .product-actions{
    gap:4px;
  }

  .qty-btn,
  .favorite-btn{
    width:40px;
    height:40px;
    min-width:40px;
  }

}

.product-name{
 font-size:1.15rem;
 font-weight:600;
}

.product-meta{
 font-size:.85rem;
 opacity:.7;
 margin-top:4px;
}

.badge{
 display:inline-block;
 padding:3px 8px;
 border-radius:999px;
 font-size:.75rem;
 font-weight:600;
 margin-left:8px;
}

.badge-warning{
 background:#fef3c7;
 color:#92400e;
}

.qty-btn{
  width:36px;
  height:36px;

  border-radius:10px;

  background:#f3f4f6;
}

.product-actions strong{
  min-width:24px;
  text-align:center;
}

.favorite-active{
 color:#facc15;
}

.category-header{
  transition:0.2s;
}

.category-header:active{
  background:rgba(79,70,229,.08);
}

@media (hover:hover){

  .category-card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
  }

}

.category-icon{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 width:38px;
 height:38px;
 border-radius:50%;
 background:#eef2ff;
 margin-right:10px;
 font-size:20px;
}

.category-count{
 background:#e0e7ff;
 color:#4338ca;
 border-radius:999px;
 padding:4px 10px;
 font-size:.8rem;
 font-weight:700;
 margin-left:10px;
}

.category-card{
  overflow:hidden;
}

#toolsBtn{
  width:100%;
}

.badge-count{
  position:absolute;
  top:-6px;
  right:-12px;

  background:#ef4444;
  color:white;

  min-width:18px;
  height:18px;

  border-radius:999px;

  font-size:.7rem;
  font-weight:700;

  display:flex;
  align-items:center;
  justify-content:center;
}

#storeBtn{
  position:relative;
}

.category-arrow{
  font-size:18px;
  width:24px;
  text-align:center;
  flex-shrink:0;
}

.category-arrow.open{
  transform:rotate(90deg);
}

#stats{
  margin-bottom:16px;
}

#progressCard{
  padding:24px;
}

.category-header h3{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:0;
  width:100%;
}

.category-header h3 .category-title{
  flex:1;
  min-width:0;
  white-space:normal;
}

@media(max-width:768px){

  .category-header h3{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
  }

  .category-count{
    margin-left:0;
  }

}

.version-info{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid #e5e7eb;
  text-align:center;
  font-size:.8rem;
  opacity:.65;
  font-weight:600;
  cursor:default;
  user-select:none;
}

.input-error{
  border:2px solid #ef4444 !important;
  box-shadow:0 0 0 3px rgba(239,68,68,.15);
}

.menu-day{
 background:#f8fafc;
 border:1px solid #e5e7eb;
 border-radius:16px;
 padding:16px;
 margin-bottom:14px;
}

.menu-title{
 display:flex;
 align-items:center;
 gap:10px;
 margin-bottom:12px;
 font-weight:700;
 font-size:1.1rem;
 color:#4338ca;
}

.menu-slot{
 margin-top:8px;
}

.menu-select{
 width:100%;
 padding:12px;
 border:1px solid #d1d5db;
 border-radius:12px;
 background:white;
 margin-top:6px;
}

body.dark .menu-day{
 background:#1f2937;
 border-color:#374151;
}

body.dark .menu-select{
 background:#111827;
 color:white;
 border-color:#4b5563;
}

.app-subtitle{
  color:rgba(255,255,255,.85);
  font-size:.9rem;
  margin-top:4px;
  font-weight:500;
}

#toolsWrapper{
  position:relative;
  flex:1;
}
	
</style>
      
</head>

<script>

const APP_VERSION = '1.1.18';
	
const APP_NOTIFICATION = {
  version: APP_VERSION,
  title: '🏠 SmartCourses',
  message: 'Nouvelle version disponible : améliorations des performances, corrections et nouvelles fonctionnalités.'
};

const defaults={
 mode:'catalog',
 showPurchased:false,
waitingForAmount:false,
 dark:false,
 showBudgetView:false,
 showMenuView:false,

 categories:[],
 products:[],
 shoppingHistory:[],

 meals:[],
weeklyMenu:{
  lundi:{
  midi:'',
  soir:'',
  collapsed:false
},
  mardi:{
   midi:'',
  soir:'',
  collapsed:false
},
  mercredi:{
   midi:'',
  soir:'',
  collapsed:false
},
  jeudi:{
   midi:'',
  soir:'',
  collapsed:false
},
  vendredi:{
   midi:'',
  soir:'',
  collapsed:false
},
  samedi:{
   midi:'',
  soir:'',
  collapsed:false
},
  dimanche:{
    midi:'',
  soir:'',
  collapsed:false
}
}
};

let db;

try{

 db=
  JSON.parse(
   localStorage.getItem(
    'shopping-v1'
   )
  );

}catch(e){

 db=null;

}

if(!db){

 db=defaults;

}

if(db.showPurchased === undefined){
db.showPurchased = false;
}

if(db.showSuggestionsView === undefined){
 db.showSuggestionsView = false;
}

if(db.showFavoritesView === undefined){
 db.showFavoritesView = false;
}

if(
 !Array.isArray(
  db.shoppingHistory
 )
){
 db.shoppingHistory = [];
}

	if(db.showBudgetView === undefined){
 db.showBudgetView = false;
}

if(db.showMenuView === undefined){
  db.showMenuView = false;
}

if(db.waitingForAmount === undefined){
  db.waitingForAmount = false;
}

if(!Array.isArray(db.meals)){
 db.meals = [];
}

if(
 !db.weeklyMenu ||
 typeof db.weeklyMenu.lundi === 'string'
){

 db.weeklyMenu = {
  lundi:{midi:'',soir:'',collapsed:false},
  mardi:{midi:'',soir:'',collapsed:false},
  mercredi:{midi:'',soir:'',collapsed:false},
  jeudi:{midi:'',soir:'',collapsed:false},
  vendredi:{midi:'',soir:'',collapsed:false},
  samedi:{midi:'',soir:'',collapsed:false},
  dimanche:{midi:'',soir:'',collapsed:false}
 };

}

Object.keys(db.weeklyMenu).forEach(day => {

 if(
  db.weeklyMenu[day].collapsed === undefined
 ){
  db.weeklyMenu[day].collapsed = false;
 }

});

db.categories =
 Array.isArray(db.categories)
 ? db.categories
 : [];

db.products =
 Array.isArray(db.products)
 ? db.products
 : [];

db.categories.forEach(category=>{

 if(category.order===undefined){

  category.order=0;

 }

 if(category.collapsed===undefined){

  category.collapsed=true;

 }

});

db.products.forEach(product=>{

 if(product.favorite===undefined){

  product.favorite=false;

 }

 if(product.inList===undefined){

  product.inList=false;

 }

 if(product.listQuantity===undefined){

  product.listQuantity=1;

 }

 if(product.purchased===undefined){

  product.purchased=false;

 }

 if(product.frequency===undefined){

  product.frequency=0;

 }

 if(product.lastPurchase===undefined){

  product.lastPurchase=null;

 }

 if(
  !Array.isArray(
   product.purchaseHistory
  )
 ){

  product.purchaseHistory=[];

 }

});

function save(){

 localStorage.setItem(
  'shopping-v1',
  JSON.stringify(db)
 );

}

function uid(){

 return Date.now() + Math.random();

}

function getProductById(id){

 return db.products.find(
  p=>p.id===id
 );

}

function getCategoryById(id){

 return db.categories.find(
  c=>c.id===id
 );

}

function setMode(mode){

 db.mode = mode;

 save();

 render();

}

function daysAgo(date){

 if(!date){

  return 'Jamais acheté';

 }

 const diff=Math.floor(

  (
   Date.now()
   -
   new Date(date).getTime()
  )

  /
  86400000

 );

 if(diff===0){

  return 'Acheté aujourd’hui';

 }

 if(diff===1){

  return 'Acheté hier';

 }

 return 'Acheté il y a '
        +
        diff
        +
        ' jours';

}

function sortCategories(){

 db.categories.sort(
  (a,b)=>
   (a.order||0)
   -
   (b.order||0)
 );

}

function toggleFavorite(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.favorite=
  !product.favorite;

 save();

 render();

}

function toggleList(id){

 const product =
  getProductById(id);

 if(!product){
  return;
 }

 product.inList =
  !product.inList;

 if(!product.inList){

  product.listQuantity = 1;
  product.purchased = false;

 }

 save();
 render();

}

function increaseQuantity(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 product.listQuantity=
  (product.listQuantity||1)+1;

 save();

 render();

}

function decreaseQuantity(id){

 const product=
  getProductById(id);

 if(!product){
  return;
 }

 if(
  product.listQuantity>1
 ){

  product.listQuantity--;

 }

 save();

 render();

}

function getListQuantity(product){

 return product.listQuantity || 1;

}

function averageRepurchaseDays(product){

 if(
  product.purchaseHistory.length<2
 ){
  return null;
 }

 let total=0;

 for(
  let i=1;
  i<product.purchaseHistory.length;
  i++
 ){

  const previous=
   new Date(
    product.purchaseHistory[
      i-1
    ].date
   );

  const current=
   new Date(
    product.purchaseHistory[
      i
    ].date
   );

  total +=

   (
    current-previous
   )

   /86400000;

 }

 return Math.round(

  total/

  (
   product.purchaseHistory.length-1
  )

 );

}

function daysSinceLastPurchase(
 product
){

 if(
  !product.lastPurchase
 ){
  return null;
 }

 return Math.floor(

  (
   Date.now()
   -
   new Date(
    product.lastPurchase
   )
  )

  /86400000

 );

}

function shouldSuggest(
 product
){

 const average=
  averageRepurchaseDays(
   product
  );

 if(
  average===null
 ){
  return false;
 }

 const elapsed=
  daysSinceLastPurchase(
   product
  );

 if(
  elapsed===null
 ){
  return false;
 }

 return elapsed>=average;

}

function importTxtCatalog(text){

 let currentCategory = null;

 const lines = text
  .split('\n')
  .map(line => line.trim())
  .filter(Boolean);

 lines.forEach(line => {

  if(line.endsWith(':')){

   const categoryName =
    line.slice(0,-1).trim();

   let category =
    db.categories.find(
     c =>
      c.name.toLowerCase() ===
      categoryName.toLowerCase()
    );

   if(!category){

    category = {
      id: uid(),
      name: categoryName,
      order: db.categories.length + 1,
      collapsed: false
    };

    db.categories.push(category);
   }

   currentCategory = category;
   return;
  }

  if(!currentCategory){
   return;
  }

  const exists =
   db.products.some(
    p =>
     p.categoryId === currentCategory.id &&
     p.name.toLowerCase() ===
     line.toLowerCase()
   );

  if(exists){
   return;
  }

  db.products.push({
    id: uid(),
    name: line,
    categoryId: currentCategory.id,
    favorite: false,
    inList: false,
    listQuantity: 1,
    purchased: false,
    frequency: 0,
    lastPurchase: null,
    purchaseHistory: []
  });

 });

 save();
}

function toggleCategory(id){

 const category=
  getCategoryById(id);

 if(!category){
  return;
 }

 category.collapsed=
  !category.collapsed;

 save();

 render();

}


function addToList(id){

 const product =
  getProductById(id);

 if(!product){
  return;
 }

 product.inList = true;
 
 product.purchased = false;

 if(!product.listQuantity){
  product.listQuantity = 1;
 }

 save();
 render();

}

function addAllSuggested(){

 db.products
  .filter(
   p =>
    !p.inList &&
    shouldSuggest(p)
  )
  .forEach(p=>{
   p.inList = true;

   if(!p.listQuantity){
    p.listQuantity = 1;
   }
  });

 save();
 render();
}

function addAllFavorites(){

 db.products

async function loadCatalog(){

 try{

  const response =
   await fetch('catalogue.txt');

  const text =
   await response.text();

  importTxtCatalog(text);

 }catch(error){

  console.error(
   'Impossible de charger catalogue.txt',
   error
  );

 }

}

async function loadMeals(){

 try{

  const response =
   await fetch('menu.txt');

  const text =
   await response.text();

  db.meals =
   text
    .split('\n')
    .filter(Boolean)
    .map(line => {

      const parts =
       line.split('|');

      return {
       name: parts[0].trim(),
       ingredients:
        parts[1]
         .split(',')
         .map(i => i.trim())
      };

    });

 }catch(error){

  console.error(error);

 }

}

function showAppNotification(){

  const seenVersion =
    localStorage.getItem(
      'notification-version'
    );

  if(
    seenVersion === APP_NOTIFICATION.version
  ){
    return;
  }

setTimeout(() => {
  alert(
    APP_NOTIFICATION.title +
    ' ' +
    APP_NOTIFICATION.version +
    '\n\n' +
    APP_NOTIFICATION.message
  );
}, 500);

  localStorage.setItem(
    'notification-version',
    APP_NOTIFICATION.version
  );

}

function isShoppingFinished(){

 const total =
  db.products.filter(
   p => p.inList
  ).length;

 const done =
  db.products.filter(
   p => p.inList && p.purchased
  ).length;

 return total > 0 && done === total;

}

function resetSelection(){

  if(
    db.mode === 'store' &&
    isShoppingFinished()
  ){
    return;
  }

  db.products.forEach(product => {
    product.inList = false;
    product.purchased = false;
    product.listQuantity = 1;
  });

  db.showPurchased = false;
	db.showBudgetView = false;
	db.showMenuView = false;
	db.waitingForAmount = false;
  db.mode = 'catalog';

  save();
  closeToolsMenu();
  render();
}

function generateShoppingFromMenu(){

if(db.waitingForAmount){

alert(

"Veuillez d'abord enregistrer le montant des courses en cours."

);

return;

}
	
 const selectedMeals = [];

Object.values(db.weeklyMenu)
 .forEach(day => {

   if(day.midi){
    selectedMeals.push(day.midi);
   }

   if(day.soir){
    selectedMeals.push(day.soir);
   }

 });

 const ingredients =
  new Set();

 selectedMeals.forEach(mealName => {

  const meal =
   db.meals.find(
    m => m.name === mealName
   );

  if(!meal){
   return;
  }

  meal.ingredients.forEach(i =>
   ingredients.add(i)
  );

 });

 ingredients.forEach(ingredient => {

  const product =
   db.products.find(
    p =>
     p.name.toLowerCase()
     === ingredient.toLowerCase()
   );

  if(product){

   product.inList = true;

  }

 });

 db.showMenuView = false;
 db.mode = 'store';

 save();
 render();

}

function finishShopping(){

  if(!isShoppingFinished()){
    alert(
      "Tous les produits doivent être récupérés avant l'enregistrement."
    );
    return;
  }

  const amountInput =
    document.getElementById(
      'shoppingAmount'
    );

  const amount =
    parseFloat(
      amountInput?.value || 0
    );

  if(
    !Number.isFinite(amount)
    ||
    amount <= 0
  ){
    amountInput.classList.add(
      'input-error'
    );

    amountInput.focus();

    return;
  }

  db.shoppingHistory.unshift({

    date:
      new Date().toISOString(),

    amount

  });

  db.shoppingHistory =
    db.shoppingHistory.slice(
      0,
      20
    );

  const now =
    new Date().toISOString();

  db.products.forEach(product => {

    if(
      product.inList &&
      product.purchased
    ){

      product.frequency++;

      product.lastPurchase = now;

      product.purchaseHistory.push({

        date: now,

        quantity:
          product.listQuantity

      });

    }

  });

  db.products.forEach(product => {

    if(product.inList){

      product.inList = false;

      product.purchased = false;

      product.listQuantity = 1;

    }

  });

  db.showPurchased = false;

  db.showBudgetView = true;

  db.mode = '';

  db.waitingForAmount = false;

  save();

  render();

}

     <button

if(db.mode==='store'){
progressCard.style.display=
'block';

const remaining =
 total - done;

let progressMessage = '';

if(total > 0){

 if(done === total){

  progressMessage =
   '✅ Tous les produits ont été récupérés';

 }else if(remaining === 1){

  progressMessage =
   '⏳ Plus que 1 produit à prendre';

 }else{

  progressMessage =
   '⏳ Encore ' +
   remaining +
   ' produits à prendre';

 }

}

stats.innerHTML =
`
<div style="
 font-size:1.2rem;
 font-weight:700;
">
 ${done} / ${total} produits récupérés
</div>

<div style="
 margin-top:8px;
 font-size:1rem;
 opacity:.75;
">
 ${progressMessage}
</div>
`;



bar.style.width=
(
total
?
done*100/total
:
0
)+'%';


}else{
progressCard.style.display=
'none';
}
sortCategories();

for(const cat of db.categories){

let items=

 db.products.filter(p=>{

  if(
   p.categoryId!==cat.id
  ){
   return false;
  }

  if(
   !p.name
     .toLowerCase()
     .includes(q)
  ){
   return false;
  }

  return true;

 });

const categoryItems =
 items.filter(
  p => p.inList
 );

const totalItems =
 categoryItems.length;

const remainingItems =
 categoryItems.filter(
  p => !p.purchased
 ).length;

if(db.mode==='store'){

 items=
 items.filter(
  p =>
   p.inList &&
   (
    db.showPurchased ||
    !p.purchased
   )
 );

}

if(
 db.mode === 'store' &&
 !db.showPurchased &&
 remainingItems === 0
){
 continue;
}

if(items.length===0){
 continue;
}
let html =
  '<div class="card category-card" data-id="'+cat.id+'">' +
  '<div class="row category-header" onclick="toggleCategory('+cat.id+')">' +
  '<span class="category-arrow ' +
  (cat.collapsed ? '' : 'open') +
  '">❯</span>' +
  '<h3>' +
	'<span class="category-title">' +
	categoryIcon(cat.name) +
	' ' +
	cat.name +
	'</span>' +
	'<span class="category-count">' +
	(
	db.mode === 'store'
    ? (
        remainingItems === 0
          ? '✅ ' + totalItems + ' / ' + totalItems
          : remainingItems + ' / ' + totalItems
      )
    : items.length +
      (items.length > 1
        ? ' produits'
        : ' produit')
	) +
	'</span></h3>';

html+='</div>';
items.sort((a,b)=>{

  // 2. À racheter
  const aSuggest = shouldSuggest(a);
  const bSuggest = shouldSuggest(b);

  if(aSuggest && !bSuggest){
    return -1;
  }

  if(!aSuggest && bSuggest){
    return 1;
  }

  // 3. Déjà dans la liste
  if(a.inList && !b.inList){
    return -1;
  }

  if(!a.inList && b.inList){
    return 1;
  }

  // 4. Tri alphabétique
  return a.name.localeCompare(
    b.name,
    'fr',
    {sensitivity:'base'}
  );

});
if(!cat.collapsed){
for(const p of items){

const badgeSuggest =
shouldSuggest(p)
? '<span class="badge badge-warning">🔔</span>'
: '';


if(db.mode==='catalog'){

html +=
'<div class="product-row">'+

'<button class="favorite-btn '+(p.favorite ? 'favorite-active' : '')+'" onclick="toggleFavorite('+p.id+')">'+
(p.favorite ? '⭐' : '☆')+
'</button>'+

'<div class="product-main">'+

'<div class="product-name">'+
p.name+
badgeSuggest+
'</div>'+

'<div class="product-meta">'+
(
p.lastPurchase
? '🕒 '+daysAgo(p.lastPurchase)
: 'Jamais acheté'
)+
'</div>'+

'</div>'+

'<div class="product-actions">'+

(
p.inList
? '<button onclick="toggleList('+p.id+')">✅</button>'
: '<button onclick="addToList('+p.id+')">🛒</button>'
)+

(
p.inList
? '<button class="qty-btn" onclick="decreaseQuantity('+p.id+')">−</button>'+
'<strong>'+getListQuantity(p)+'</strong>'+
'<button class="qty-btn" onclick="increaseQuantity('+p.id+')">+</button>'
: ''
)+

'</div>'+
'</div>';

}
if(db.mode==='store'){

 html+=
 '<div class="item" data-product-id="'+p.id+'">'+

  '<input type="checkbox" '+

  (
   p.purchased
   ? 'checked'
   : ''
  )+

  ' onchange="togglePurchased('+p.id+')">' +

  '<span class="'+

  (
   p.purchased
   ? 'done'
   : ''
  )+

  '">' +

  p.name+

  ' x'+

  getListQuantity(p)+

  '</span>'+

  '</div>';

}

}

}

html+='</div>';

app.innerHTML+=html;

}

}
